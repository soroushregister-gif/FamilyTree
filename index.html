<style>
:root{--bg:#f6f7f4;--fg:#1d2a22;--pr:#2e7d5b;--sf:#fff;--ln:#7a8a80;--bd:#d5dbd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a16;--fg:#e6efe9;--sf:#202a24;--ln:#8fa397;--bd:#34423a}}
:root[data-theme=dark]{--bg:#141a16;--fg:#e6efe9;--sf:#202a24;--ln:#8fa397;--bd:#34423a}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#hd{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:52px;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--pr);color:#fff;z-index:5}
#hd h1{flex:1;font-size:16px;margin:0;text-align:center;font-weight:600}
.ib{background:none;border:0;color:#fff;font-size:22px;width:42px;height:42px;border-radius:50%;cursor:pointer}
#st{position:absolute;inset:0;touch-action:none}
#lay{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
svg path{fill:none}.ed,.al,.hit{vector-effect:non-scaling-stroke}.ed{stroke:var(--ln);stroke-width:2}.al{stroke:#e6c84a;stroke-width:2;stroke-dasharray:6 5;opacity:.8}
.hit{stroke:transparent;stroke-width:18;pointer-events:stroke}
.blk{position:absolute;width:118px;height:52px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 6px;color:#1d2a22;font-size:13px;line-height:1.3;overflow:hidden;box-shadow:0 1px 3px #0003;border:2px solid transparent}
.blk.m{border-radius:0}.blk.f{border-radius:12px}
.blk.sel{border-color:#1d2a22;filter:brightness(.88);box-shadow:0 0 0 3px #2e7d5b88}
.blk.ghost{opacity:.65;border:2px dashed #e6c84a}
.blk img{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid #fff}
.blk span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.blk.hi span{padding:0 18px}.blk span{text-align:center}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:30px;box-shadow:0 3px 8px #0005;z-index:5;cursor:pointer}
#md{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:10}
#md.on{display:flex}
.sh{background:var(--sf);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.sh h3{margin:0 0 10px;font-size:16px}
.bt{display:block;width:100%;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;cursor:pointer;text-align:center}
.bt.p{background:var(--pr);color:#fff;border-color:var(--pr)}.bt.s{padding:7px;font-size:12px}
.row{display:flex;gap:6px}.row .bt{flex:1}
.in{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.pf{display:flex;gap:10px;align-items:center}.ph{width:76px;height:76px;border-radius:12px;background:var(--bg) center/cover;border:1px solid var(--bd);flex:none}
.cd{font-size:12px;opacity:.7;margin-top:2px}
.pal{display:none;grid-template-columns:repeat(10,1fr);gap:5px;margin:6px 0}.pal.on{display:grid}
.pal i{aspect-ratio:1;border-radius:6px;border:2px solid transparent}.pal i.c{border-color:#000}
#mm{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:12px;background:rgba(20,26,22,.72);border:2px solid rgba(255,255,255,.55);z-index:4;pointer-events:none;opacity:0;transition:opacity .35s}#mm.on{opacity:1}
#fb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%);z-index:6;background:#c0392b;color:#fff;border:0;border-radius:18px;padding:7px 14px;font:inherit;font-size:13px;box-shadow:0 2px 6px #0004;max-width:92%;display:none}
small{opacity:.6}#ts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:20;display:none}
</style></head><body>
<div id="hd"><button class="ib" id="b3">⋮</button><button class="ib" id="bs">🔍</button><img src="icon-192.png" alt="" style="width:32px;height:32px;border-radius:8px"><h1 id="tt"></h1><button class="ib" id="bt">☰</button></div>
<div id="st"><div id="lay"></div></div>
<button id="fab">+</button><canvas id="mm"></canvas><button id="fb"></button><div id="md"></div><div id="ts"></div>

<script>
const $=s=>document.querySelector(s),BW=118,BH=52;
const COLORS=['#cdbff0','#ffcba4','#b8e0d2','#f9c6d3','#c5dcf5','#fff0a8','#d9ead3','#e6c7f0','#ffd9a0','#c0ece8','#f4b8a8','#d7d7d7','#bfe3a8','#a8c8f0','#f0c8e0','#e8dca8','#a8e0e8','#e0b8b8','#c8c0e8','#f8e0c0'];
const uid=()=>Math.random().toString(36).slice(2,9);
const FONTS=[['وزیرمتن','Vazirmatn'],['نسخ نوتو','Noto Naskh Arabic'],['کوفی نوتو','Noto Kufi Arabic'],['امیری','Amiri'],['لالezar'.replace('ezar','ه‌زار'),'Lalezar'],['میرزا','Mirza'],['عارف رقعه','Aref Ruqaa'],['راکاس','Rakkas'],['مرکزی','Markazi Text'],['قاهره','Cairo'],['تجوال','Tajawal'],['هارماتن','Harmattan']];
function mix(h,k){const n=parseInt(h.slice(1),16),f=c=>Math.round(c+(255-c)*k);return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'}
function depths(t){const d={};Object.keys(t.blocks).forEach(i=>d[i]=0);
 for(let k=0;k<30;k++){let ch=0;t.edges.forEach(e=>{if(e.t=='c'){const m=Math.max(...e.p.filter(p=>d[p]!=null).map(p=>d[p]));if(d[e.c]!=null&&m+1>d[e.c]){d[e.c]=m+1;ch=1}}else if(e.t=='s'&&d[e.a]!=null&&d[e.b]!=null){const m=Math.max(d[e.a],d[e.b]);if(d[e.a]!=m||d[e.b]!=m){d[e.a]=d[e.b]=m;ch=1}}});if(!ch)break}return d}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem('fam1'))}catch(e){}
const newTab=n=>({id:uid(),name:n,blocks:{},edges:[],trash:[],view:{tx:innerWidth/2,ty:innerHeight/2,s:1}});
if(!S||!S.tabs||!S.tabs.length)S={tabs:[newTab('اصلی')],cur:0};
const save=()=>{try{localStorage.setItem('fam1',JSON.stringify(S))}catch(e){}};
const T=()=>S.tabs[S.cur];
let sel=null;
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
function mkcode(g){const c=new Set();S.tabs.forEach(t=>Object.values(t.blocks).forEach(b=>c.add(b.code)));let k;do{k=(g=='m'?'a':'b')+Math.floor(10000+Math.random()*90000)}while(c.has(k));return k}
/* sheets */
const md=$('#md');
function sheet(h){md.innerHTML='<div class="sh">'+h+'</div>';md.className='on';md.onpointerdown=e=>{if(e.target==md)closeS()}}
function closeS(){md.className='';md.innerHTML=''}
function ask(q,opts,cb){sheet((q?'<h3>'+q+'</h3>':'')+opts.map((o,i)=>`<button class="bt" data-i="${i}">${o[0]}</button>`).join(''));md.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{closeS();cb(opts[b.dataset.i][1])})}
function pick(title,cb,ex){
 sheet('<h3>'+title+'</h3><input id="pq" class="in" placeholder="اسم یا کد یکتا…"><div id="pl"></div>');
 const q=$('#pq'),l=$('#pl');
 const go=()=>{const vsP=visible(),k=q.value.trim().toLowerCase();l.innerHTML=Object.values(T().blocks).filter(b=>b.id!=ex&&(!vsP||vsP.has(b.id))&&(!k||(b.name+' '+b.code+' '+(b.desc||'')).toLowerCase().includes(k))).slice(0,30).map(b=>`<button class="bt" data-id="${b.id}">${esc(b.name||'بی‌نام')} <small>${b.code}</small></button>`).join('')||'<p>موردی نیست</p>';
  l.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{closeS();cb(x.dataset.id)})};
 q.oninput=go;go();q.focus();
}
/* view */
let anim=0;
function tween(tx,ty,s){const v=T().view,a=[v.tx,v.ty,Math.log(v.s)],b=[tx,ty,Math.log(s)],t0=performance.now(),id=++anim;
 (function f(n){if(id!=anim)return;const k=Math.min(1,(n-t0)/300),e=k*(2-k);v.tx=a[0]+(b[0]-a[0])*e;v.ty=a[1]+(b[1]-a[1])*e;v.s=Math.exp(a[2]+(b[2]-a[2])*e);render();if(k<1)requestAnimationFrame(f);else save()})(t0)}
function goTo(id){const b=T().blocks[id],v=T().view;if(!b)return;sel=id;tween(innerWidth/2-b.x*v.s,innerHeight/2-b.y*v.s,v.s)}
function fit(a,b){const v=T().view,dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
 const s=Math.max(1e-3,Math.min(v.s,innerWidth*.8/(dx+BW),innerHeight*.65/(dy+BH)));
 tween(innerWidth/2-(a.x+b.x)/2*s,innerHeight/2-(a.y+b.y)/2*s,s)}
/* geometry */
const spouseOf=id=>{const e=T().edges.find(e=>e.t=='s'&&(e.a==id||e.b==id));return e?(e.a==id?e.b:e.a):null};
const refs=e=>e.t=='c'?[...e.p,e.c]:e.t=='s'?[e.a,e.b]:[e.a,e.r];
const OFF={'همسر':g=>[g=='m'?-1:1,0],'پسر':()=>[.7,1.6],'دختر':()=>[-.7,1.6],'پدر':()=>[.5,-1.6],'مادر':()=>[-.5,-1.6]};
function render(){
 const t=T(),v=t.view,bl=t.blocks,dp=depths(t),vs=visible(),ok=i=>!vs||vs.has(i),P=id=>[bl[id].x,bl[id].y];$('#lay').style.transform=`translate(${v.tx}px,${v.ty}px) scale(${v.s})`;
 let sv='',hs='',bh='';
 t.edges.forEach(e=>{
  if(!refs(e).every(i=>bl[i]&&ok(i)))return;let d,cls='ed';
  if(e.t=='s'){const a=P(e.a),b=P(e.b);d=`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`}
  else if(e.t=='c'){const ps=e.p.map(P);const ax=ps.reduce((s,p)=>s+p[0],0)/ps.length,ay=ps.length>1?ps.reduce((s,p)=>s+p[1],0)/ps.length:ps[0][1]+BH/2;const c=P(e.c),my=(ay+c[1]-BH/2)/2;d=`M${ax} ${ay}V${my}H${c[0]}V${c[1]-BH/2}`}
  else{const a=P(e.a),r=P(e.r),o=OFF[e.role](bl[e.a].g);const gx=r[0]+o[0]*(BW+30),gy=r[1]+o[1]*(BH+20);d=`M${a[0]} ${a[1]}L${gx} ${gy}`;cls='al';
   bh+=`<div class="blk ${bl[e.a].g} ghost" data-gb="${e.a}" style="left:${gx-BW/2}px;top:${gy-BH/2}px;background:${bl[e.a].color}"><span>${esc(bl[e.a].name||'بی‌نام')} <small>(${e.role})</small></span></div>`}
  sv+=`<path class="${cls}" d="${d}"/>`;hs+=`<path class="hit" data-e="${e.id}" d="${d}"/>`});
 Object.values(bl).forEach(b=>{if(!ok(b.id))return;const p=P(b.id),sx=p[0]*v.s+v.tx,sy=p[1]*v.s+v.ty;if(sx<-BW*v.s||sy<-BH*v.s||sx>innerWidth+BW*v.s||sy>innerHeight+BH*v.s)return;
  bh+=`<div class="blk ${b.g}${sel==b.id?' sel':''}${b.img?' hi':''}" data-b="${b.id}" style="left:${p[0]-BW/2}px;top:${p[1]-BH/2}px;background:${mix(b.color,Math.min(.8,.1*dp[b.id]))};font-family:'${b.font||'Vazirmatn'}',Tahoma,sans-serif;font-size:${b.fs||13}px">${b.img?`<img src="${b.img}">`:''}<span>${b.pin?'📌 ':''}${esc(b.name||'بی‌نام')}</span></div>`});
 $('#lay').innerHTML=`<svg>${sv}${hs}</svg>${bh}`;$('#tt').textContent=t.name;mapCheck(v);{const fb=$('#fb');fb.style.display=vs?'block':'none';if(vs)fb.textContent='✕ بازگشت از منطقه‌بندی ('+[...flt].join('، ')+')'}
}
/* gestures */
const st=$('#st'),ptr=new Map();let g=null,tm=null;
const mid=()=>{const p=[...ptr.values()];return[(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2,Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1]};
st.addEventListener('pointerdown',e=>{
 st.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});anim++;const v=T().view;
 if(ptr.size==2){clearTimeout(tm);const m=mid();g={k:'pinch',d:m[2],s:v.s,wx:(m[0]-v.tx)/v.s,wy:(m[1]-v.ty)/v.s};return}
 if(ptr.size>2)return;
 const bl=e.target.closest('[data-b]'),gh=e.target.closest('[data-gb]'),ed=e.target.closest('[data-e]');
 g={k:'down',x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,b:bl&&bl.dataset.b,gb:gh&&gh.dataset.gb,e:ed&&ed.dataset.e,armed:false};
 if(g.b)tm=setTimeout(()=>{g.armed=true;sel=g.b;navigator.vibrate&&navigator.vibrate(20);render()},380)});
st.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId)||!g)return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});const v=T().view;
 if(g.k=='pinch'&&ptr.size>=2){const m=mid();v.s=Math.min(1e3,Math.max(1e-3,g.s*m[2]/g.d));v.tx=m[0]-g.wx*v.s;v.ty=m[1]-g.wy*v.s;render();return}
 if(ptr.size>1)return;
 const dx=e.clientX-g.lx,dy=e.clientY-g.ly;
 if(g.k=='down'&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>8){clearTimeout(tm);if(g.armed&&g.b){g.k='drag';const b=T().blocks[g.b];g.ox=b.x;g.oy=b.y}else g.k='pan'}
 if(g.k=='pan'){v.tx+=dx;v.ty+=dy;render()}
 else if(g.k=='drag'){const b=T().blocks[g.b];b.x+=dx/v.s;b.y+=dy/v.s;render()}
 g.lx=e.clientX;g.ly=e.clientY});
function connected(id){const seen=new Set([id]),q=[id];while(q.length){const c=q.pop();T().edges.forEach(e=>{if(e.t=='a')return;const r=refs(e);if(r.includes(c))r.forEach(i=>{if(!seen.has(i)&&T().blocks[i]){seen.add(i);q.push(i)}})})}return seen}
function end(e){
 ptr.delete(e.pointerId);clearTimeout(tm);if(!g)return;
 if(g.k=='pinch'){if(ptr.size<2){g={k:'none'};save()}return}
 const k=g.k,gg=g;g=null;
 if(k=='pan'){save();return}
 if(k=='drag'){const b=T().blocks[gg.b],dx=b.x-gg.ox,dy=b.y-gg.oy;save();
  ask('بلوک‌های متصل هم جابجا شوند؟',[['بله، همه‌ی متصل‌ها',1],['نه، فقط همین بلوک',0]],a=>{if(a){connected(b.id).forEach(i=>{if(i!=b.id){T().blocks[i].x+=dx;T().blocks[i].y+=dy}})}save();render()});return}
 if(k=='down'){if(gg.gb)popup(gg.gb);else if(gg.b){if(!gg.armed)popup(gg.b)}
  else if(gg.e){const ed=T().edges.find(x=>x.id==gg.e),bl=T().blocks;if(ed){const r=refs(ed).filter(i=>bl[i]);let a,b;
   if(ed.t=='c'){a=bl[ed.p[0]];b=bl[ed.c]}else{a=bl[r[0]];b=bl[r[1]]}fit(a,b)}}
  else{sel=null;render()}}}
st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
st.addEventListener('wheel',e=>{e.preventDefault();const v=T().view,f=Math.exp(-e.deltaY*.0015),wx=(e.clientX-v.tx)/v.s,wy=(e.clientY-v.ty)/v.s;v.s=Math.min(1e3,Math.max(1e-3,v.s*f));v.tx=e.clientX-wx*v.s;v.ty=e.clientY-wy*v.s;render();save()},{passive:false});
/* add */
function free(n){const t=T(),B=Object.values(t.blocks),hasE=t.edges.some(e=>e.t!='a'&&refs(e).includes(n.id)),d=n.g=='m'?1:-1,ov=(a,o)=>Math.abs(o.x-a.x)<BW+10&&Math.abs(o.y-a.y)<BH+10;
 if(!hasE){let i=0;while(i++<60&&B.some(o=>o!=n&&ov(n,o)))n.x+=d*(BW+16);return}
 const own=connected(n.id);
 for(let i=0;i<80;i++){let hit=null;
  for(const a of own){for(const o of B){if(!own.has(o.id)&&ov(t.blocks[a],o)){hit=[t.blocks[a],o];break}}if(hit)break}
  if(!hit){let k=0;while(k++<60&&B.some(o=>o!=n&&own.has(o.id)&&ov(n,o)))n.x+=d*(BW+16);break}
  const[a,o]=hit,sg=o.x>=a.x?1:-1,amt=BW+16-Math.abs(o.x-a.x);
  connected(o.id).forEach(k=>{if(!own.has(k))t.blocks[k].x+=sg*amt})}}
function nb(g){const n={id:uid(),g,name:'',code:mkcode(g),x:0,y:0,color:(S.defc&&S.defc[g])||(g=='m'?COLORS[0]:COLORS[1]),desc:''};T().blocks[n.id]=n;return n}
function newBlock(g){if(flt&&flt.size){toast('اول از منطقه‌بندی خارج شو');return}const v=T().view,n=nb(g);n.x=(innerWidth/2-v.tx)/v.s;n.y=(innerHeight/2-v.ty)/v.s;free(n);save();render()}
function addRel(r){
 const t=T(),u=k=>k,bl=t.blocks,b=bl[sel];if(!b)return;const sp=spouseOf(b.id);let n;
 if(r=='همسر'){n=nb(b.g=='m'?'f':'m');n.x=b.x+(b.g=='m'?-1:1)*u(BW+44);n.y=b.y;t.edges.push({id:uid(),t:'s',a:b.id,b:n.id});
  t.edges.forEach(e=>{if(e.t=='c'&&e.p.length==1&&e.p[0]==b.id)e.p.push(n.id)})}
 else if(r=='پسر'||r=='دختر'){const g=r=='پسر'?'m':'f',d=g=='m'?1:-1;n=nb(g);
  const ax=sp?(b.x+bl[sp].x)/2:b.x,sib=t.edges.filter(e=>e.t=='c'&&e.p.includes(b.id)).map(e=>bl[e.c]).filter(c=>c&&c.g==g&&c!=n);
  n.x=sib.length?(d>0?Math.max(...sib.map(c=>c.x)):Math.min(...sib.map(c=>c.x)))+d*u(BW+20):ax+d*u(60);n.y=b.y+u(BH+90);
  t.edges.push({id:uid(),t:'c',p:sp?[b.id,sp]:[b.id],c:n.id})}
 else{const g=r=='پدر'?'m':'f',d=g=='m'?1:-1;n=nb(g);
  const ex=t.edges.find(e=>e.t=='c'&&e.c==b.id&&e.p.length<2&&bl[e.p[0]]&&bl[e.p[0]].g!=g);
  if(ex){const o=bl[ex.p[0]];n.y=o.y;n.x=o.x+d*u(BW+44);ex.p.push(n.id);t.edges.push({id:uid(),t:'s',a:o.id,b:n.id})}
  else{n.x=b.x+d*u(60);n.y=b.y-u(BH+90);t.edges.push({id:uid(),t:'c',p:[n.id],c:b.id})}}
 free(n);save();render()}
const relMenu=()=>ask('افزودن به «'+esc(T().blocks[sel].name||'بی‌نام')+'»',['همسر','پسر','دختر','پدر','مادر'].map(x=>[x,x]),addRel);

/* village filter */
let flt=null;
const normV=s=>(s||'').trim().replace(/\s+/g,' ');
function visible(){if(!flt||!flt.size)return null;const t=T(),vs=new Set(),done=new Set();
 Object.values(t.blocks).forEach(b=>{if(done.has(b.id))return;const comp=connected(b.id);comp.forEach(i=>done.add(i));
  if([...comp].some(i=>flt.has(normV(t.blocks[i].vil))))comp.forEach(i=>vs.add(i))});return vs}
function fitAll(){const vs=visible(),B=Object.values(T().blocks).filter(o=>!vs||vs.has(o.id));if(!B.length)return;
 const a=Math.min(...B.map(o=>o.x-BW/2)),e=Math.max(...B.map(o=>o.x+BW/2)),b=Math.min(...B.map(o=>o.y-BH/2)),f=Math.max(...B.map(o=>o.y+BH/2));
 const s=Math.max(1e-3,Math.min(1,innerWidth*.9/(e-a),(innerHeight-120)/(f-b)));tween(innerWidth/2-(a+e)/2*s,innerHeight/2-(b+f)/2*s+10,s)}

/* minimap */
let lastV='',mmT;
function mapCheck(v){const k=v.tx.toFixed(1)+'|'+v.ty.toFixed(1)+'|'+v.s+'|'+S.cur;if(k==lastV)return;const first=lastV==='';lastV=k;if(first)return;drawMap();const m=$('#mm');m.classList.add('on');clearTimeout(mmT);mmT=setTimeout(()=>m.classList.remove('on'),3000)}
function drawMap(){const c=$('#mm'),d=devicePixelRatio||1,W=120,H=120;c.width=W*d;c.height=H*d;const x=c.getContext('2d');x.scale(d,d);
 const t=T(),v=t.view,vs0=visible(),B=Object.values(t.blocks).filter(o=>!vs0||vs0.has(o.id)),vx=-v.tx/v.s,vy=-v.ty/v.s,vw=innerWidth/v.s,vh=innerHeight/v.s;
 let a=vx,b=vy,e=vx+vw,f=vy+vh;B.forEach(o=>{a=Math.min(a,o.x-BW/2);b=Math.min(b,o.y-BH/2);e=Math.max(e,o.x+BW/2);f=Math.max(f,o.y+BH/2)});
 const k=Math.min((W-10)/(e-a),(H-10)/(f-b)),ox=(W-(e-a)*k)/2,oy=(H-(f-b)*k)/2;
 B.forEach(o=>{x.fillStyle=o.color;x.fillRect(ox+(o.x-BW/2-a)*k,oy+(o.y-BH/2-b)*k,Math.max(3,BW*k),Math.max(2,BH*k))});
 x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(ox+(vx-a)*k,oy+(vy-b)*k,vw*k,vh*k)}
/* merge tabs */
function mergeTabs(i){const A=T(),B=S.tabs[i];if(!B||B==A)return;
 try{localStorage.setItem('fam1u',JSON.stringify({tabs:S.tabs,cur:S.cur}))}catch(e){}
 const AB=Object.values(A.blocks),BB=Object.values(B.blocks);let dx=0,dy=0;
 if(AB.length&&BB.length){dx=Math.max(...AB.map(o=>o.x))+BW*2-Math.min(...BB.map(o=>o.x));dy=Math.min(...AB.map(o=>o.y))-Math.min(...BB.map(o=>o.y))}
 const codes=new Set(AB.map(o=>o.code));
 BB.forEach(o=>{if(A.blocks[o.id])return;const n=JSON.parse(JSON.stringify(o));n.x+=dx;n.y+=dy;if(codes.has(n.code))n.code=mkcode(n.g);codes.add(n.code);A.blocks[n.id]=n});
 B.edges.forEach(e=>{if(!A.edges.some(o=>o.id==e.id)&&refs(e).every(x=>A.blocks[x]))A.edges.push(JSON.parse(JSON.stringify(e)))});
 A.trash=(A.trash||[]).concat(B.trash||[]);
 S.tabs.splice(i,1);S.cur=S.tabs.indexOf(A);sel=null;save();render();toast('دو تب یکی شد')}
function undoMerge(){let u=null;try{u=JSON.parse(localStorage.getItem('fam1u'))}catch(e){}
 if(!u){toast('چیزی برای آندو نیست');return}
 ask('آندو، همه‌ی تغییرهای بعد از یکی‌کردن را هم برمی‌گرداند. ادامه؟',[['بله، برگردان','y'],['نه','n']],a=>{if(a!='y')return;S.tabs=u.tabs;S.cur=u.cur;try{localStorage.removeItem('fam1u')}catch(e){}sel=null;save();render();toast('یکی‌کردن برگشت')})}
/* delete / trash */
function del(id){const t=T(),b=t.blocks[id],es=t.edges.filter(e=>refs(e).includes(id)).map(e=>JSON.parse(JSON.stringify(e)));
 t.trash.push({b,es,at:Date.now()});delete t.blocks[id];
 t.edges=t.edges.filter(e=>{if(e.t=='c'&&e.p.includes(id)){e.p=e.p.filter(x=>x!=id);return e.p.length>0&&e.c!=id}return !refs(e).includes(id)});
 if(sel==id)sel=null;save();render()}
function restore(i){const t=T(),z=t.trash.splice(i,1)[0];t.blocks[z.b.id]=z.b;
 z.es.forEach(e=>{if(refs(e).every(x=>t.blocks[x])){t.edges=t.edges.filter(o=>o.id!=e.id);t.edges.push(e)}});save();render()}
function trashSheet(){const t=T();
 sheet('<h3>ریکاوری (حذف‌شده‌ها)</h3>'+(t.trash.length?t.trash.map((z,i)=>`<div class="row"><button class="bt" style="flex:2;text-align:right">${esc(z.b.name||'بی‌نام')} <small>${z.b.code}</small></button><button class="bt s" data-r="${i}">بازگردانی</button><button class="bt s" data-d="${i}">حذف دائمی</button></div>`).join(''):'<p>خالی است</p>'));
 md.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{restore(+b.dataset.r);trashSheet()});

function pinSheet(){const bl=Object.values(T().blocks).filter(b=>b.pin).sort((a,b)=>a.pin-b.pin);
 sheet('<h3>فهرست پین‌ها</h3>'+(bl.length?bl.map((b,i)=>`<div class="row"><button class="bt" data-g="${b.id}" style="flex:3">${i+1}. ${esc(b.name||'بی‌نام')}</button><button class="bt s" data-u="${i}">▲</button><button class="bt s" data-w="${i}">▼</button></div>`).join(''):'<p>پینی نیست</p>'));
 const sw=(i,j)=>{if(j<0||j>=bl.length)return;[bl[i].pin,bl[j].pin]=[bl[j].pin,bl[i].pin];save();pinSheet()};

 $('#pf2').value=b.font||'Vazirmatn';
 $('#pfi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onerror=()=>toast('تصویر خوانده نشد');im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=140;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,140,140);img=c.toDataURL('image/jpeg',.8);paint()};im.src=r.result};r.readAsDataURL(f)};
 $('#pr').onclick=()=>{img='';paint()};

 $('#ps').onclick=()=>{apply();closeS()};$('#px').onclick=closeS;

$('#bt').onclick=()=>ask('تب‌ها',[...S.tabs.map((t,i)=>[(i==S.cur?'✓ ':'')+esc(t.name),i]),['＋ تب جدید',-1],['✎ تغییر نام تب فعلی',-2],['⇄ یکی کردن تب فعلی با تب دیگر',-3],['↶ آندوی یکی‌کردن',-4]],i=>{
 if(i==-3){if(S.tabs.length<2){toast('حداقل دو تب لازم است');return}ask('کدام تب داخل «'+esc(T().name)+'» ریخته شود؟ (آن تب حذف می‌شود)',S.tabs.map((t,j)=>[esc(t.name),j]).filter(o=>o[1]!=S.cur),mergeTabs);return}

function ioSheet(mode){const bk=mode=='backup';
 sheet(`<h3>${{backup:'پشتیبان‌گیری',restore:'بازیابی پشتیبان',sync:'همگام‌سازی'}[mode]}</h3>${bk?'':'<input type="file" id="fl" class="in">'}<textarea id="tx" class="in" rows="6" ${bk?'readonly':'placeholder="یا متن پشتیبان را اینجا بچسبانید"'}>${bk?esc(JSON.stringify(S)):''}</textarea><div class="row">${bk?'<button class="bt p" id="dl">دانلود فایل</button><button class="bt" id="cp">کپی</button>':'<button class="bt p" id="go">انجام</button>'}<button class="bt" id="cl">بستن</button></div>`);
 $('#cl').onclick=closeS;
 if(bk){$('#dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='family-backup.json';a.click()}catch(e){}};
  $('#cp').onclick=()=>{$('#tx').select();try{navigator.clipboard.writeText($('#tx').value)}catch(e){document.execCommand('copy')}toast('کپی شد')}}
 else{$('#fl').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>$('#tx').value=r.result;r.readAsText(f)}};
  $('#go').onclick=()=>{let d;try{d=JSON.parse($('#tx').value)}catch(e){toast('فایل نامعتبر است');return}

   if(mode=='restore'){S=d;S.cur=0;sel=null}else{let n=0;d.tabs.forEach(dt=>{const t=S.tabs.find(x=>x.id==dt.id||x.name==dt.name);
    if(!t){S.tabs.push(dt);n+=Object.keys(dt.blocks).length;return}
    const cs=new Set(Object.values(t.blocks).map(b=>b.code)),kn=new Set([...Object.keys(t.blocks),...(t.trash||[]).map(z=>z.b.id)]);
